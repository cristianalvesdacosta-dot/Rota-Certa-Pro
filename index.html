<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Master – Gestão de Entregadores</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px 12px; }
        .container { max-width: 700px; margin: 0 auto; }
        .master-card { background: #1e293b; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: 1px solid #334155; margin-bottom: 16px; }
        h1 { font-size: 1.25rem; font-weight: 700; text-align: center; margin-bottom: 6px; color: #38bdf8; }
        p.sub { font-size: 0.8rem; text-align: center; color: #94a3b8; margin-bottom: 20px; }
        
        .entregador-row { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 14px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
        @media(min-width: 500px) {
            .entregador-row { flex-direction: row; justify-content: space-between; align-items: center; }
        }
        
        .info-area h3 { font-size: 0.95rem; font-weight: 600; color: #fff; }
        .info-area p { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; margin-top: 4px; }
        .status-online { background: #065f46; color: #34d399; }
        .status-offline { background: #7f1d1d; color: #fca5a5; }
        .status-ativo { color: #34d399; font-weight: 600; }
        .status-bloqueado { color: #fca5a5; font-weight: 600; }

        .acoes-area { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn { padding: 8px 12px; border: none; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; text-align: center; }
        .btn-local { background: #2563eb; color: white; }
        .btn-local:hover { background: #1d4ed8; }
        .btn-bloquear { background: #dc2626; color: white; }
        .btn-bloquear:hover { background: #b91c1c; }
        .btn-liberar { background: #16a34a; color: white; }
        .btn-liberar:hover { background: #15803d; }
        .btn-excluir { background: #475569; color: white; }
        .btn-excluir:hover { background: #334155; }
        
        #toastMaster { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #38bdf8; color: #0f172a; padding: 10px 20px; border-radius: 30px; font-weight: 700; font-size: 0.85rem; display: none; z-index: 999; }
    </style>
</head>
<body>

    <div id="toastMaster"></div>

    <div class="container">
        <div class="master-card">
            <h1>🛠️ Painel Master – Gestão de Entregadores</h1>
            <p class="sub">Controle de licenças, acessos e monitoramento em tempo real</p>
            
            <div id="listaEntregadores">
                <p style="text-align: center; color: #94a3b8; font-size: 0.85rem;">Carregando entregadores...</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            databaseURL: "https://rotacertagps-9ff13-default-rtdb.firebaseio.com"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        function mostrarToast(msg) {
            const t = document.getElementById('toastMaster');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3000);
        }

        // CARREGA TODOS OS ENTREGADORES CADASTRADOS NO FIREBASE
        db.ref('entregadores').on('value', (snapshot) => {
            const container = document.getElementById('listaEntregadores');
            container.innerHTML = '';

            if (!snapshot.exists()) {
                container.innerHTML = '<p style="text-align: center; color: #94a3b8; font-size: 0.85rem;">Nenhum entregador cadastrado ainda.</p>';
                return;
            }

            snapshot.forEach((childSnapshot) => {
                let key = childSnapshot.key;
                let d = childSnapshot.val();
                let agora = new Date().getTime();
                
                let expiraEm = d.expiraEm || 0;
                let estaAtivo = agora <= expiraEm;
                let statusLicencaTxt = estaAtivo ? '<span class="status-ativo">Ativa / Teste</span>' : '<span class="status-bloqueado">Expirada / Bloqueada</span>';
                
                let statusTrabalho = d.status === 'online' ? '<span class="status-badge status-online">🟢 Online</span>' : '<span class="status-badge status-offline">🔴 Offline</span>';
                
                let latInfo = d.lat ? d.lat.toFixed(4) : 'N/D';
                let lonInfo = d.lon ? d.lon.toFixed(4) : 'N/D';

                let row = document.createElement('div');
                row.className = 'entregador-row';
                row.innerHTML = `
                    <div class="info-area">
                        <h3>${d.nome || key} <span style="font-size:0.75rem; color:#94a3b8;">(ID: ${key})</span></h3>
                        <p>Status: ${statusTrabalho} | Licença: ${statusLicencaTxt}</p>
                        <p>WhatsApp: ${d.whatsapp || 'Não informado'} | Lat/Lon: ${latInfo}, ${lonInfo}</p>
                    </div>
                    <div class="acoes-area">
                        <button class="btn btn-local" onclick="verLocalizacao('${d.lat}', '${d.lon}', '${d.nome}')">📍 Ver</button>
                        ${estaAtivo ? 
                            `<button class="btn btn-bloquear" onclick="alterarLicenca('${key}', false)">🔒 Bloquear</button>` : 
                            `<button class="btn btn-liberar" onclick="alterarLicenca('${key}', true)">✅ Liberar 30 Dias</button>`
                        }
                        <button class="btn btn-excluir" onclick="excluirEntregador('${key}')">🗑️ Excluir</button>
                    </div>
                `;
                container.appendChild(row);
            });
        });

        // FUNÇÃO DE BLOQUEAR OU LIBERAR (ATUALIZA A DATA NO FIREBASE)
        function alterarLicenca(usuarioKey, liberar) {
            let novoExpiraEm;
            let agora = new Date().getTime();
            
            if (liberar) {
                // Adiciona 30 dias a partir de agora
                novoExpiraEm = agora + (30 * 24 * 60 * 60 * 1000);
            } else {
                // Zera a data para expirar imediatamente (bloqueia)
                novoExpiraEm = agora - 1000;
            }

            db.ref('entregadores/' + usuarioKey).update({ expiraEm: novoExpiraEm }).then(() => {
                mostrarToast(liberar ? '✅ Acesso liberado por 30 dias!' : '🔒 Acesso bloqueado com sucesso!');
            });
        }

        function verLocalizacao(lat, lon, nome) {
            if (!lat || lat === 'undefined' || !lon || lon === 'undefined') {
                mostrarToast('⚠️ Este entregador ainda não enviou a localização.');
                return;
            }
            window.open(`https://www.google.com/maps?q=${lat},${lon}`, '_blank');
        }

        function excluirEntregador(usuarioKey) {
            if (confirm(`Tem certeza que deseja excluir o entregador "${usuarioKey}"?`)) {
                db.ref('entregadores/' + usuarioKey).remove().then(() => {
                    mostrarToast('🗑️ Entregador removido.');
                });
            }
        }
    </script>
</body>
</html>

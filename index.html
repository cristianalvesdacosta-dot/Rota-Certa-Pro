<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota Certa - Acesso</title>
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #333; margin-top: 0; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; padding: 12px; background: #2980b9; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        button:hover { background: #2471a3; }
        .error { color: #e74c3c; font-size: 13px; margin-bottom: 15px; display: none; }
        #tela-bloqueio, #painel-interno { display: none; }
        .painel-box { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: left; width: 100%; max-width: 400px; }
        .btn-sair { background: #c0392b; margin-top: 15px; }
    </style>
</head>
<body>

    <!-- 1. TELA DE LOGIN -->
    <div id="tela-login" class="card">
        <h2>🚀 Rota Certa</h2>
        <p>Digite seu usuário e senha:</p>
        <div id="erro-msg" class="error"></div>
        <input type="text" id="usuario" placeholder="Nome (ex: Carlos)" autocomplete="off">
        <input type="password" id="senha" placeholder="Senha">
        <button type="button" onclick="entrarSistema()">Entrar / Cadastrar</button>
    </div>

    <!-- 2. TELA DE BLOQUEIO -->
    <div id="tela-bloqueio" class="card" style="background: #e74c3c; color: #fff;">
        <h2>⚠️ Acesso Bloqueado</h2>
        <p>Sua assinatura precisa ser renovada para liberar o painel.</p>
        <button class="btn-sair" onclick="fazerLogout()">Sair</button>
    </div>

    <!-- 3. PAINEL DO ENTREGADOR -->
    <div id="painel-interno" class="painel-box">
        <h2>📦 Painel do Entregador</h2>
        <p>Bem-vindo, <b id="nome-user"></b>!</p>
        <hr style="border:0; border-top:1px solid #eee; margin: 15px 0;">
        <p>Status: <span style="color: #2ecc71; font-weight: bold;">🟢 Ativo</span></p>
        <button class="btn-sair" onclick="fazerLogout()">Sair da Conta</button>
    </div>

    <script>
        // Inicialização limpa do Firebase
        const firebaseConfig = {
            databaseURL: "https://rotacerta-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Verifica se já está logado ao abrir
        window.onload = function() {
            const salvo = localStorage.getItem('motoLogada');
            if (salvo) {
                checarStatusBanco(salvo);
            }
        };

        function entrarSistema() {
            let uInput = document.getElementById('usuario').value.trim();
            let sInput = document.getElementById('senha').value.trim();
            let msg = document.getElementById('erro-msg');

            if (!uInput || !sInput) {
                msg.style.display = 'block';
                msg.innerText = 'Preencha todos os campos!';
                return;
            }
            msg.style.display = 'none';

            // Limpa o nome para virar uma chave segura no banco
            let chaveUser = uInput.replace(/[^a-zA-Z0-9]/g, "");

            let ref = db.ref('entregadores/' + chaveUser);

            ref.once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    let dados = snapshot.val();
                    if (dados.senha === sInput) {
                        localStorage.setItem('motoLogada', chaveUser);
                        checarStatusBanco(chaveUser);
                    } else {
                        msg.style.display = 'block';
                        msg.innerText = 'Senha incorreta!';
                    }
                } else {
                    // Cria automaticamente o cadastro se não existir
                    ref.set({
                        senha: sInput,
                        status: 'online'
                    }).then(() => {
                        localStorage.setItem('motoLogada', chaveUser);
                        checarStatusBanco(chaveUser);
                    });
                }
            }).catch((err) => {
                msg.style.display = 'block';
                msg.innerText = 'Erro de conexão: ' + err.message;
            });
        }

        function checarStatusBanco(usuario) {
            document.getElementById('tela-login').style.display = 'none';
            
            db.ref('entregadores/' + usuario).on('value', (snapshot) => {
                if (!snapshot.exists()) {
                    fazerLogout();
                    return;
                }
                let dados = snapshot.val();
                let status = dados.status || 'online';

                if (status === 'online') {
                    document.getElementById('tela-bloqueio').style.display = 'none';
                    document.getElementById('painel-interno').style.display = 'block';
                    document.getElementById('nome-user').innerText = usuario;
                } else {
                    document.getElementById('painel-interno').style.display = 'none';
                    document.getElementById('tela-bloqueio').style.display = 'block';
                }
            });
        }

        function fazerLogout() {
            localStorage.removeItem('motoLogada');
            window.location.reload();
        }
    </script>
</body>
</html>

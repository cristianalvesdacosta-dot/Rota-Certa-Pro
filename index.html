<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Solicitação de Entregas</title>
    <!-- Leaflet CSS para Mapas -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h2 {
            margin-top: 0;
            color: var(--primary-color);
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="tel"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .form-group {
            flex: 1;
        }

        .row .form-group.small {
            flex: 0 0 100px;
        }

        #map {
            height: 250px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .summary-box {
            background: #f1f5f9;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .summary-box p {
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
        }

        .summary-box p strong {
            color: var(--text-main);
        }

        button {
            width: 100%;
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #15803d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Solicitar Entrega</h2>

        <div class="form-group">
            <label for="clientName">Nome do Cliente</label>
            <input type="text" id="clientName" placeholder="Ex: João da Silva">
        </div>

        <div class="form-group">
            <label for="clientPhone">Telefone</label>
            <input type="tel" id="clientPhone" placeholder="Ex: (91) 99999-9999">
        </div>

        <div class="form-group">
            <label for="pickupAddress">Endereço de Coleta (Origem)</label>
            <div class="row">
                <div class="form-group" style="margin-bottom:0;">
                    <input type="text" id="pickupAddress" placeholder="Rua, Bairro...">
                </div>
                <div class="form-group small" style="margin-bottom:0;">
                    <input type="text" id="pickupNumber" placeholder="Nº">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="deliveryAddress">Endereço de Destino (Entrega)</label>
            <div class="row">
                <div class="form-group" style="margin-bottom:0;">
                    <input type="text" id="deliveryAddress" placeholder="Rua, Bairro...">
                </div>
                <div class="form-group small" style="margin-bottom:0;">
                    <input type="text" id="deliveryNumber" placeholder="Nº">
                </div>
            </div>
        </div>

        <div id="map"></div>

        <div class="summary-box">
            <p><span>Distância Estimada:</span> <strong id="distanceText">0.00 km</strong></p>
            <p><span>Valor Total:</span> <strong id="priceText">R$ 0,00</strong></p>
        </div>

        <button onclick="sendToWhatsappMotoboy()">Enviar Pedido via WhatsApp</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Configurações Globais / Estado
        let deliveryDistanceKm = 3.5; // Exemplo padrão simulado
        let calculatedFinalPrice = 15.00; // Exemplo padrão simulado
        let pickupCoords = { lat: -1.4558, lng: -48.4902 }; // Exemplo inicial (Belém)
        let deliveryCoords = { lat: -1.4600, lng: -48.4800 };
        let configMotoboyAtual = { whatsapp: '5591988888888' };

        // Inicialização básica do mapa
        const map = L.map('map').setView([-1.4558, -48.4902], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Atualiza a interface com os valores iniciais de exemplo
        document.getElementById('distanceText').innerText = deliveryDistanceKm.toFixed(2) + ' km';
        document.getElementById('priceText').innerText = 'R$ ' + calculatedFinalPrice.toFixed(2).replace('.', ',');

        function sendToWhatsappMotoboy() {
            const name = document.getElementById('clientName').value;
            const phone = document.getElementById('clientPhone').value;
            const pickup = document.getElementById('pickupAddress').value + (document.getElementById('pickupNumber').value ? `, Nº ${document.getElementById('pickupNumber').value}` : '');
            const delivery = document.getElementById('deliveryAddress').value + (document.getElementById('deliveryNumber').value ? `, Nº ${document.getElementById('deliveryNumber').value}` : '');

            // Pega as coordenadas para montar os links limpos do Google Maps
            let linkColeta = pickupCoords ? `https://www.google.com/maps?q=${pickupCoords.lat},${pickupCoords.lng}` : 'Endereço digitado';
            let linkEntrega = deliveryCoords ? `https://www.google.com/maps?q=${deliveryCoords.lat},${deliveryCoords.lng}` : 'Endereço digitado';

            const message = `*Nova Solicitação de Entrega*\n\n` +
                `👤 *Nome:* ${name || 'Não informado'}\n` +
                `📱 *Telefone:* ${phone || 'Não informado'}\n\n` +
                `📍 *Coleta (A):* ${pickup || 'Não informado'}\n` +
                `🗺️ *Mapa Coleta:* ${linkColeta}\n\n` +
                `🏁 *Destino (B):* ${delivery || 'Não informado'}\n` +
                `🗺️ *Mapa Destino:* ${linkEntrega}\n\n` +
                `📏 *Distância:* ${deliveryDistanceKm.toFixed(2)} km\n` +
                `💰 *Valor Total:* R$ ${calculatedFinalPrice.toFixed(2).replace('.', ',')}\n` +
                `💳 *Pagamento:* Pix realizado`;

            let whatsappDestino = configMotoboyAtual.whatsapp || '5591988888888';
            window.open(`https://wa.me/${whatsappDestino}?text=${encodeURIComponent(message)}`, '_blank');
        }
    </script>
</body>
</html>
